<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Place</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <h2>MARKET PLACE</h2>
    <nav>
        <a href="#">Home</a>
        <a href="#sell">Sell</a>
        <a href="#profile">Profile</a>
    </nav>
</header>

<section class="hero">
    <h1>MarketPlace</h1>
    <p>Buy & Sell Used Products</p>

    <div class="search">
        <input type="text" id="searchInput"
        placeholder="Search products...">
        <button onclick="displayProducts()">🔍</button>
    </div>
</section>

<section class="products-section">
    <h2>Latest Products</h2>
    <div class="product-container" id="productList">
    </div>
</section>

<section class="sell-section" id="sell">
    <h2>Sell Your Product</h2>

    <input type="text" id="productName"
    placeholder="Enter Product Name">

    <input type="number" id="productPrice"
    placeholder="Enter Product Price">

    <input type="file" id="productImage"
    accept="image/*">

    <button onclick="addProduct()">Add Product</button>
</section>

<section class="profile-section" id="profile">
    <h2>My Profile</h2>
    <p>Welcome to Market Place</p>
    <p>Products Listed: <span id="count">0</span></p>
</section>

<footer>
    <p>© 2026 Market Place | Buy and Sell Products</p>
</footer>

</body>
</html>
